[project]
name = "safe-nmap-assistant"
version = "0.1.0"
description = "A policy-constrained MCP Nmap assistant for authorized network reconnaissance."
requires-python = ">=3.12"

dependencies = [
    "mcp[cli]==2.2.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]